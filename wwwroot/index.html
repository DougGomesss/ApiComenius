<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POC - Orçamentos WhatsApp</title>
    <script type="module" crossorigin src="/assets/index-CvIwJR8u.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CE8K-Epl.css">
  </head>
  <body>
    <div id="app">
      <header class="header">
        <button id="chatButton" class="ghost-button">Chat</button>
        <button id="resetAllButton" class="danger-button">Limpar Orçamentos</button>
      </header>

      <div id="passwordModal" class="modal-overlay hidden">
        <div class="modal-box">
          <h3>Confirmar ação</h3>
          <p>Digite a senha para limpar os orçamentos:</p>
          <input id="passwordInput" type="password" placeholder="Senha" autocomplete="off" />
          <p id="passwordError" class="password-error hidden">Senha errada, digite a correta.</p>
          <div class="modal-actions">
            <button id="modalCancelButton" class="modal-cancel">Cancelar</button>
            <button id="modalConfirmButton" class="danger-button">Confirmar</button>
          </div>
        </div>
      </div>

      <div id="chatPasswordModal" class="modal-overlay hidden">
        <div class="modal-box">
          <h3>Acesso ao Chat</h3>
          <p>Digite a senha para acessar o chat:</p>
          <input id="chatPasswordInput" type="password" placeholder="Senha" autocomplete="off" />
          <p id="chatPasswordError" class="password-error hidden">Senha errada, digite a correta.</p>
          <div class="modal-actions">
            <button id="chatModalCancelButton" class="modal-cancel">Cancelar</button>
            <button id="chatModalConfirmButton" class="ghost-button" style="opacity:1;cursor:pointer;">Entrar</button>
          </div>
        </div>
      </div>

      <main class="layout">
        <section class="budgets-panel">
          <div class="panel-header">
            <h2>Orçamentos</h2>
            <button id="refreshBudgetsButton">Atualizar</button>
          </div>

          <div class="budget-search">
            <input
              id="budgetSearchInput"
              type="text"
              placeholder="Busque pelo nome"
              autocomplete="off"
            />
          </div>

          <div id="budgetsList" class="budgets-list"></div>
        </section>

        <section class="budgets-panel">
          <div class="panel-header">
            <h2>Clientes em espera</h2>
            <button id="refreshWaitingButton">Atualizar</button>
          </div>

          <div id="waitingList" class="budgets-list"></div>
        </section>

        <section class="budgets-panel">
          <div class="panel-header">
            <h2>Orçamentos cancelados</h2>
            <button id="refreshCanceledButton">Atualizar</button>
          </div>

          <div id="canceledList" class="budgets-list"></div>
        </section>
      </main>

      <div id="chatModal" class="modal-overlay hidden">
        <div class="chat-modal-box">
          <div class="chat-modal-header">
            <span>Chat — Atendimento</span>
            <button id="chatCloseButton" class="modal-cancel">✕</button>
          </div>
          <div class="chat-layout">
            <div class="chat-sidebar">
              <h3>Conversas</h3>
              <div id="chatConversationList"></div>
            </div>
            <div class="chat-window">
              <div id="chatHeader" class="chat-header">Selecione uma conversa</div>
              <div id="chatMessages" class="chat-messages"></div>
              <div class="chat-input-area">
                <input id="chatInput" type="text" placeholder="Digite sua mensagem..." autocomplete="off" />
                <button id="chatSendButton">Enviar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
